name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The patching routines build and run on a plain host. That is what catches
  # a regression before hardware does.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the host harnesses
        run: |
          set -eu
          mkdir -p build-host
          gcc -O2 -Wall -o build-host/test_sha    host/test_sha.c    source/sha256.c
          gcc -O2 -w     -o build-host/test_icon   host/test_icon.c   source/icongen.c -lm
          gcc -O2 -w     -o build-host/test_banner host/test_banner.c source/bannergen.c source/icongen.c -lm
          gcc -O2 -w     -o build-host/test_patch  host/test_patch.c  source/cia_patch.c source/sha256.c
          gcc -O2 -Wall -o build-host/test_idalloc host/test_idalloc.c source/idalloc.c source/sha256.c
          gcc -O2 -Wall -o build-host/test_cwav host/test_cwav.c source/cwav.c
          gcc -O2 -Wall -o build-host/reseal host/reseal.c source/cia_patch.c source/sha256.c
          gcc -O2 -w     -o build-host/test_compose host/test_compose.c source/bannergen.c source/icongen.c -lm
          gcc -O2 -Wall -o build-host/test_ndsicon host/test_ndsicon.c source/ndsicon.c -lm

      # Only the self-contained ones run here. test_icon, test_banner and
      # test_patch need input files that are not in the repository; building
      # them still guards against a broken build.
      - name: Run the self-contained tests
        run: |
          set -eu
          ./build-host/test_sha
          ./build-host/test_idalloc
          ./build-host/test_cwav

  windows-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fwdgen-pc.exe
        run: |
          set -eu
          pip install ziglang
          sh pc/build.sh

      - name: Bundle the GUI
        run: |
          set -eu
          mkdir -p "dist/RetroArch Forwarder PC"
          cp pc/fwdgen-pc.exe pc/RetroArchForwarderPC.ps1 "pc/RetroArch Forwarder PC.bat" pc/DSForwarderPC.ps1 "pc/DS Forwarder PC.bat" pc/FwdArt.cs pc/LEEME.txt template/template.cia "dist/RetroArch Forwarder PC/"

      - uses: actions/upload-artifact@v4
        with:
          name: fwdgen-pc
          path: dist/
          if-no-files-found: error

  release:
    needs: [tests, windows-tool]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fwdgen-pc
          path: pc-dist

      - name: Zip the Windows tool
        run: cd pc-dist && zip -r "../RetroArch-Forwarder-PC.zip" "RetroArch Forwarder PC"

      - uses: softprops/action-gh-release@v2
        with:
          files: RetroArch-Forwarder-PC.zip
          generate_release_notes: true
